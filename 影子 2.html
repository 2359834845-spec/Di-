<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>影子配對 - 回家密碼鎖</title>
    <style>
        :root {
            --sky-top: #1a1a3e;
            --sky-bottom: #ff9a76;
            --house-color: #f5e6d3;
            --roof-color: #8b4513;
            --grass: #4a7c3f;
            --golden: #ffd700;
            --warm-light: #ffe4b5;
            --screen-glow: #a8e6a3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'PingFang TC', 'Microsoft YaHei', 'Noto Sans TC', 'Heiti TC', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a1a;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            cursor: default;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* 主場景：使用 flex 列，確保內容完整顯示 */
        .game-scene {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(180deg,
                    #1a1a4e 0%, #2d3a6e 15%, #5a6fa5 30%,
                    #ff9a76 55%, #ffb88c 65%, #fad0c4 75%,
                    #4a7c3f 80%, #3d6b34 100%);
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.5), 0 0 0 3px rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
        }

        /* 上方區域：天空與房子 */
        .upper-area {
            position: relative;
            width: 100%;
            flex: 1 1 auto;
            min-height: 0;
            pointer-events: none;
            z-index: 0;
        }

        .sky {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .moon {
            position: absolute;
            top: 6%;
            right: 12%;
            width: 5vmin;
            height: 5vmin;
            min-width: 30px;
            min-height: 30px;
            background: radial-gradient(circle at 40% 35%, #fffde7 0%, #ffe082 40%, #ffb300 100%);
            border-radius: 50%;
            box-shadow: 0 0 5vmin rgba(255, 215, 0, 0.6), 0 0 10vmin rgba(255, 200, 50, 0.35);
            animation: moonGlow 3s ease-in-out infinite;
        }
        @keyframes moonGlow {
            0%, 100% { box-shadow: 0 0 5vmin rgba(255, 215, 0, 0.6), 0 0 10vmin rgba(255, 200, 50, 0.35); }
            50% { box-shadow: 0 0 7vmin rgba(255, 215, 0, 0.8), 0 0 14vmin rgba(255, 200, 50, 0.5); }
        }

        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60%;
        }
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle var(--dur) ease-in-out infinite;
            animation-delay: var(--delay);
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.6); }
        }

        .clouds {
            position: absolute;
            top: 8%;
            left: 0;
            width: 100%;
            height: 30%;
            pointer-events: none;
            z-index: 1;
        }
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            animation: floatCloud var(--dur2) linear infinite;
        }
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: inherit;
            border-radius: 50%;
        }
        .cloud::before { width: 60%; height: 80%; top: -35%; left: 15%; }
        .cloud::after { width: 50%; height: 65%; top: -20%; left: 40%; }
        @keyframes floatCloud {
            0% { transform: translateX(0); }
            100% { transform: translateX(8vmin); }
        }

        /* 房子 */
        .house-container {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .house-body {
            position: relative;
            width: 30vmin;
            max-width: 220px;
            height: 25vmin;
            max-height: 180px;
            background: #fdf5e6;
            border-radius: 6px 6px 0 0;
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.6), 8px 8px 30px rgba(0,0,0,0.3);
            border: 3px solid #e8d5c0;
            overflow: visible;
        }
        .roof {
            position: absolute;
            top: -11vmin; left: -4vmin;
            width: 0; height: 0;
            border-left: 19vmin solid transparent;
            border-right: 19vmin solid transparent;
            border-bottom: 12vmin solid #7b3f1a;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
            z-index: 2;
        }
        .roof-highlight {
            position: absolute;
            top: -10vmin; left: -3vmin;
            width: 0; height: 0;
            border-left: 17vmin solid transparent;
            border-right: 17vmin solid transparent;
            border-bottom: 10vmin solid #9c5a2e;
            z-index: 3;
            pointer-events: none;
        }
        .chimney {
            position: absolute;
            top: -14vmin; right: 5vmin;
            width: 4vmin; height: 8vmin;
            background: #c4956b;
            border-radius: 4px 4px 0 0;
            z-index: 1;
        }
        .window {
            position: absolute;
            width: 6vmin; height: 6vmin;
            max-width: 40px; max-height: 40px;
            background: #fffbe6;
            border: 3px solid #d4a574;
            border-radius: 4px;
            top: 4vmin;
            z-index: 4;
            box-shadow: inset 0 0 20px rgba(255,220,100,0.7), 0 0 15px rgba(255,200,60,0.5);
        }
        .window-left { left: 4vmin; }
        .window-right { right: 4vmin; }
        .window-cross { position: absolute; background: #d4a574; }
        .window-cross-h { width: 100%; height: 2px; top: 50%; left: 0; transform: translateY(-50%); }
        .window-cross-v { width: 2px; height: 100%; left: 50%; top: 0; transform: translateX(-50%); }
        .door {
            position: absolute;
            bottom: 0; left: 50%; transform: translateX(-50%);
            width: 11vmin; max-width: 70px;
            height: 16vmin; max-height: 105px;
            background: linear-gradient(180deg, #d4a574 0%, #c08b5c 50%, #b07848 100%);
            border-radius: 8px 8px 0 0;
            border: 3px solid #a06840;
            z-index: 5;
            transform-origin: left center;
            transition: transform 1.2s cubic-bezier(0.25, 0.1, 0.25, 1);
            box-shadow: 3px 0 10px rgba(0,0,0,0.2);
        }
        .door.open {
            transform: translateX(-50%) perspective(800px) rotateY(-75deg);
        }
        .door-knob {
            position: absolute;
            right: 12%; top: 50%;
            width: 2vmin; height: 2vmin;
            background: radial-gradient(circle at 35% 35%, #ffe4b5, #b8860b);
            border-radius: 50%;
        }
        .door-glow {
            position: absolute;
            bottom: 3px; left: 50%; transform: translateX(-50%);
            width: 90%; height: 90%;
            background: radial-gradient(ellipse at center, rgba(255,200,80,0.9) 0%, rgba(255,180,50,0.5) 40%, transparent 70%);
            border-radius: 6px 6px 0 0;
            z-index: 4;
            opacity: 0;
            transition: opacity 0.8s ease;
            pointer-events: none;
        }
        .door-glow.visible { opacity: 1; }
        .girl {
            position: absolute;
            bottom: 0; left: -8vmin;
            z-index: 6;
            font-size: 8vmin;
            transition: transform 1s ease, opacity 0.6s ease;
            pointer-events: none;
            animation: girlBounce 2s ease-in-out infinite;
        }
        .girl.enter {
            transform: translate(10vmin, -4vmin) scale(0.5);
            opacity: 0;
            animation: none;
        }
        @keyframes girlBounce {
            0%, 100% { transform: translateY(0); }
            30% { transform: translateY(-1vmin); }
            50% { transform: translateY(0); }
            70% { transform: translateY(-0.5vmin); }
        }

        /* 底部區域 */
        .bottom-area {
            width: 100%;
            padding: 1vmin 2vmin 2vmin;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: stretch;
            gap: 2vmin;
            flex-shrink: 0;
            background: transparent;
        }
        .lock-panel-container {
            display: flex;
            gap: 2vmin;
            align-items: stretch;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 950px;
        }

        /* 密碼鎖面板 */
        .lock-panel {
            background: linear-gradient(180deg, #4a4a5a 0%, #3a3a48 30%, #2e2e3a 100%);
            border-radius: 2vmin;
            padding: 1.5vmin 2vmin;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 2px 0 rgba(255,255,255,0.1), 0 0 0 4px #555, 0 0 0 6px #333;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 2vmin;
            flex: 2 1 auto;
            min-width: 300px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .lock-left {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1vmin;
        }
        .lock-label {
            color: #ccc;
            font-size: 2vmin;
            letter-spacing: 2px;
            font-weight: 700;
            text-shadow: 0 0 8px rgba(200,200,255,0.4);
            white-space: nowrap;
        }
        .lock-screen {
            background: #1a2e1a;
            border-radius: 1.5vmin;
            padding: 1vmin 1.5vmin;
            border: 3px solid #333;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6), 0 0 10px rgba(160,230,160,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8vmin;
            position: relative;
            overflow: hidden;
        }
        .screen-scanline {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
            pointer-events: none; z-index: 1;
        }
        .progress-dots {
            display: flex; gap: 1.2vmin; z-index: 2;
        }
        .progress-dot {
            width: 2vmin; height: 2vmin;
            border-radius: 50%;
            background: #333;
            border: 2px solid #555;
            transition: all 0.4s ease;
        }
        .progress-dot.done {
            background: #4caf84; border-color: #6fdaa8;
            box-shadow: 0 0 12px rgba(76,175,132,0.7);
        }
        .progress-dot.current {
            border-color: #ffe082;
            animation: dotPulse 0.8s ease-in-out infinite;
        }
        @keyframes dotPulse {
            0%,100%{ box-shadow: 0 0 6px rgba(255,224,130,0.4); }
            50%{ box-shadow: 0 0 18px rgba(255,224,130,0.9); }
        }
        .shadow-display {
            width: 14vmin; height: 14vmin;
            max-width: 130px; max-height: 130px;
            display: flex; align-items: center; justify-content: center;
            z-index: 2;
        }
        .shadow-emoji {
            font-size: 11vmin;
            filter: brightness(0);
            transition: all 0.4s ease;
            line-height: 1;
        }
        .shadow-emoji.reveal {
            filter: brightness(1);
            animation: revealBounce 0.6s ease;
        }
        @keyframes revealBounce {
            0%{ transform: scale(0.5); filter: brightness(0); }
            60%{ transform: scale(1.2); filter: brightness(0.5); }
            100%{ transform: scale(1); filter: brightness(1); }
        }
        .screen-hint {
            color: #7a9a7a;
            font-size: 1.6vmin;
            z-index: 2;
            letter-spacing: 1px;
            text-align: center;
        }
        .screen-digit-preview {
            color: #a8e6a3;
            font-size: 3.5vmin;
            font-weight: bold;
            min-height: 3vmin;
            z-index: 2;
            font-family: 'SF Mono', 'Courier New', monospace;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1vmin;
            z-index: 2;
            flex: 0 1 auto;
            min-width: 140px;
            max-width: 200px;
        }
        .key-btn {
            aspect-ratio: 1/1;
            border-radius: 50%;
            border: 2px solid #666;
            background: linear-gradient(180deg, #5a5a6a 0%, #444454 100%);
            color: #e0e0e0;
            font-size: 2.5vmin;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .key-btn:active {
            transform: scale(0.92);
            background: #3a3a4a;
        }
        .key-btn.wrong {
            animation: shake 0.5s ease;
            background: #6b3030 !important;
            border-color: #ff4444 !important;
            color: #ffaaaa !important;
        }
        .key-btn.correct-flash {
            animation: correctPop 0.5s ease;
            background: #3a6b3a !important;
            border-color: #4caf84 !important;
            color: #a8e6a3 !important;
        }
        @keyframes shake {
            0%,100%{ transform: translateX(0); }
            15%{ transform: translateX(-8px); }
            30%{ transform: translateX(8px); }
            45%{ transform: translateX(-6px); }
            60%{ transform: translateX(6px); }
            75%{ transform: translateX(-3px); }
            90%{ transform: translateX(3px); }
        }
        @keyframes correctPop {
            0%{ transform: scale(1); }
            30%{ transform: scale(1.25); }
            100%{ transform: scale(1); }
        }
        .key-btn.clear-btn {
            font-size: 2vmin;
            background: linear-gradient(180deg, #5a4040 0%, #443030 100%);
            border-color: #775;
            color: #f0c0c0;
        }

        /* ✨ 全新的動物對照表：網格佈局，放大顯示 ✨ */
        .poster {
            background: #fdf8f0;
            border-radius: 2vmin;
            padding: 2vmin;
            box-shadow: 0 6px 20px rgba(0,0,0,0.35), 0 0 0 3px #d4c5a0, inset 0 0 0 2px #faf3e0;
            display: flex;
            flex-direction: column;
            gap: 1.5vmin;
            flex: 1 1 auto;
            min-width: 220px;
            max-width: 360px;
            position: relative;
        }
        .poster::before {
            content: '';
            position: absolute;
            top: -1vmin; left: 50%;
            transform: translateX(-50%);
            width: 3vmin; height: 1.2vmin;
            background: #d4c5a0;
            border-radius: 3px 3px 0 0;
        }
        .poster-title {
            text-align: center;
            font-weight: 700;
            font-size: 2.2vmin;
            color: #5a3e2b;
            letter-spacing: 2px;
            border-bottom: 2px dashed #d4c5a0;
            padding-bottom: 1vmin;
            margin-bottom: 0.5vmin;
        }

        /* 網格容器：自動換行，每行最多 3 個 */
        .poster-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1.2vmin;
            justify-content: center;
            align-items: center;
        }

        /* 每個動物格子放大 */
        .poster-row {
            display: flex;
            align-items: center;
            gap: 0.5vmin;
            padding: 1vmin 1.2vmin;
            border-radius: 1vmin;
            background: rgba(255, 255, 255, 0.7);
            justify-content: center;
            flex: 0 0 auto;
            min-width: 5vmin;
            transition: all 0.3s ease;
        }
        .poster-row.highlight {
            background: #fff9e6;
            box-shadow: 0 0 1.5vmin rgba(255,200,60,0.6);
        }
        .poster-animal {
            font-size: 5vmin;   /* 動物圖案明顯變大 */
            line-height: 1;
        }
        .poster-equals {
            color: #999;
            font-weight: bold;
            font-size: 2.2vmin;
            margin: 0 0.2vmin;
        }
        .poster-number {
            font-weight: 900;
            font-size: 3.8vmin;  /* 數字也變大 */
            color: #c0392b;
            background: #fff;
            width: 4.5vmin;
            height: 4.5vmin;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #e0c8a0;
            font-family: 'SF Mono', 'Courier New', monospace;
        }

        /* 訊息提示 */
        .message-toast {
            position: absolute;
            top: 8%; left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 1vmin 3vmin;
            border-radius: 3vmin;
            font-size: 2vmin;
            font-weight: 600;
            z-index: 20;
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            white-space: nowrap;
        }
        .message-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .message-toast.error { background: rgba(200,40,40,0.85); }
        .message-toast.success { background: rgba(40,140,70,0.85); }

        .victory-overlay {
            position: absolute; inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 25;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column;
            gap: 2vmin;
            opacity: 0; pointer-events: none;
            transition: opacity 0.8s ease;
        }
        .victory-overlay.show { opacity: 1; pointer-events: auto; }
        .victory-card {
            background: #fffef5;
            border-radius: 3vmin;
            padding: 4vmin 5vmin;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .victory-emoji { font-size: 10vmin; animation: bounceCelebrate 0.5s ease infinite alternate; }
        @keyframes bounceCelebrate {
            0%{ transform: translateY(0); }
            100%{ transform: translateY(-2vmin); }
        }
        .victory-title { font-size: 3.5vmin; font-weight: 900; color: #5a3e2b; }
        .victory-subtitle { font-size: 2vmin; color: #888; }
        .replay-btn {
            margin-top: 1vmin;
            padding: 1.5vmin 4vmin;
            border-radius: 3vmin;
            border: none;
            background: linear-gradient(135deg, #ff9a76, #fecf6a);
            color: #5a3e2b;
            font-size: 2.2vmin;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255,154,118,0.4);
        }

        .fireflies {
            position: absolute; inset: 0;
            pointer-events: none; z-index: 2;
        }
        .firefly {
            position: absolute;
            width: 0.8vmin; height: 0.8vmin;
            background: #ffe9a0;
            border-radius: 50%;
            box-shadow: 0 0 1.5vmin 0.5vmin rgba(255,230,130,0.7);
            animation: fireflyFloat var(--ff-dur) ease-in-out infinite;
            animation-delay: var(--ff-delay);
        }
        @keyframes fireflyFloat {
            0%,100%{ transform: translate(0,0); opacity:0.4; }
            25%{ transform: translate(var(--ff-x1), var(--ff-y1)); opacity:1; }
            50%{ transform: translate(var(--ff-x2), var(--ff-y2)); opacity:0.6; }
            75%{ transform: translate(var(--ff-x3), var(--ff-y3)); opacity:0.9; }
        }

        /* 極小高度下的微調 */
        @media (max-height: 500px) {
            .poster-animal { font-size: 4vmin; }
            .poster-number { font-size: 3vmin; width: 3.5vmin; height: 3.5vmin; }
            .poster-row { padding: 0.5vmin 0.8vmin; }
        }
    </style>
</head>
<body>
<div class="game-scene" id="gameScene">
    <!-- 上方：天空與房子 -->
    <div class="upper-area">
        <div class="sky">
            <div class="moon"></div>
            <div class="stars" id="starsContainer"></div>
        </div>
        <div class="clouds">
            <div class="cloud" style="width:10vmin;height:4vmin;top:6%;left:8%;--dur2:18s;"></div>
            <div class="cloud" style="width:8vmin;height:3vmin;top:12%;left:55%;--dur2:22s;"></div>
            <div class="cloud" style="width:9vmin;height:3.5vmin;top:3%;left:30%;--dur2:20s;"></div>
        </div>
        <div class="house-container">
            <div class="chimney"></div>
            <div class="chimney-smoke" id="chimneySmoke"></div>
            <div class="roof"></div>
            <div class="roof-highlight"></div>
            <div class="house-body">
                <div class="window window-left"><div class="window-cross window-cross-h"></div><div class="window-cross window-cross-v"></div></div>
                <div class="window window-right"><div class="window-cross window-cross-h"></div><div class="window-cross window-cross-v"></div></div>
                <div class="door" id="door"><div class="door-knob"></div></div>
                <div class="door-glow" id="doorGlow"></div>
            </div>
            <div class="girl" id="girl">👧</div>
        </div>
        <div class="fireflies" id="firefliesContainer"></div>
    </div>

    <!-- 底部：海報 + 密碼鎖 -->
    <div class="bottom-area">
        <div class="lock-panel-container">
            <!-- 動物對照表 (網格佈局) -->
            <div class="poster" id="poster">
                <div class="poster-title">📋 動物對照表</div>
                <div class="poster-grid" id="posterGrid"></div>
            </div>

            <!-- 密碼鎖 -->
            <div class="lock-panel" id="lockPanel">
                <div class="lock-left">
                    <div class="lock-label">🔒 電子密碼鎖</div>
                    <div class="lock-screen">
                        <div class="screen-scanline"></div>
                        <div class="progress-dots" id="progressDots">
                            <div class="progress-dot current"></div>
                            <div class="progress-dot"></div>
                            <div class="progress-dot"></div>
                            <div class="progress-dot"></div>
                        </div>
                        <div class="shadow-display">
                            <span class="shadow-emoji" id="shadowEmoji">🐱</span>
                        </div>
                        <div class="screen-hint" id="screenHint">識別影子 · 輸入數字</div>
                        <div class="screen-digit-preview" id="digitPreview"></div>
                    </div>
                </div>
                <div class="keypad" id="keypad">
                    <button class="key-btn" data-digit="1">1</button>
                    <button class="key-btn" data-digit="2">2</button>
                    <button class="key-btn" data-digit="3">3</button>
                    <button class="key-btn" data-digit="4">4</button>
                    <button class="key-btn" data-digit="5">5</button>
                    <button class="key-btn" data-digit="6">6</button>
                    <button class="key-btn" data-digit="7">7</button>
                    <button class="key-btn" data-digit="8">8</button>
                    <button class="key-btn" data-digit="9">9</button>
                    <button class="key-btn clear-btn" data-digit="clear">⌫</button>
                    <button class="key-btn" data-digit="0">0</button>
                    <button class="key-btn clear-btn" data-digit="reset">↺</button>
                </div>
            </div>
        </div>
    </div>

    <div class="message-toast" id="messageToast"></div>
    <div class="victory-overlay" id="victoryOverlay">
        <div class="victory-card">
            <div class="victory-emoji">🏠✨</div>
            <div class="victory-title">歡迎回家！</div>
            <div class="victory-subtitle">密碼正確，門已打開</div>
            <button class="replay-btn" id="replayBtn">🔄 再玩一次</button>
        </div>
    </div>
</div>

<script>
    (function() {
        const animalMap = [
            { animal: '😺', name: '貓', digit: 3 },
            { animal: '🐕', name: '狗', digit: 7 },
            { animal: '🐰', name: '兔子', digit: 2 },
            { animal: '🐦', name: '鳥', digit: 5 },
            { animal: '🐟', name: '魚', digit: 8 },
            { animal: '🐻', name: '熊', digit: 1 },
            { animal: '🦊', name: '狐狸', digit: 6 },
            { animal: '🐘', name: '大象', digit: 9 },
            { animal: '🦌', name: '鹿', digit: 4 },
            { animal: '🐿️', name: '松鼠', digit: 0 }
        ];
        const PASSWORD_LENGTH = 4;

        const door = document.getElementById('door');
        const doorGlow = document.getElementById('doorGlow');
        const girl = document.getElementById('girl');
        const shadowEmoji = document.getElementById('shadowEmoji');
        const progressDots = document.getElementById('progressDots');
        const screenHint = document.getElementById('screenHint');
        const digitPreview = document.getElementById('digitPreview');
        const keypad = document.getElementById('keypad');
        const messageToast = document.getElementById('messageToast');
        const victoryOverlay = document.getElementById('victoryOverlay');
        const replayBtn = document.getElementById('replayBtn');
        const posterGrid = document.getElementById('posterGrid');
        const lockPanel = document.getElementById('lockPanel');
        const starsContainer = document.getElementById('starsContainer');
        const firefliesContainer = document.getElementById('firefliesContainer');
        const chimneySmoke = document.getElementById('chimneySmoke');

        let passwordSequence = [];
        let currentStep = 0;
        let isGameComplete = false;
        let toastTimer = null;

        function createStars() {
            starsContainer.innerHTML = '';
            for (let i = 0; i < 30; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 0.4 + 0.2;
                star.style.width = size + 'vmin';
                star.style.height = size + 'vmin';
                star.style.left = Math.random() * 90 + '%';
                star.style.top = Math.random() * 80 + '%';
                star.style.setProperty('--dur', (Math.random() * 2 + 1.5) + 's');
                star.style.setProperty('--delay', (Math.random() * 3) + 's');
                starsContainer.appendChild(star);
            }
        }

        function createFireflies() {
            firefliesContainer.innerHTML = '';
            for (let i = 0; i < 6; i++) {
                const ff = document.createElement('div');
                ff.className = 'firefly';
                ff.style.left = (Math.random() * 80 + 10) + '%';
                ff.style.top = (Math.random() * 40 + 30) + '%';
                ff.style.setProperty('--ff-dur', (Math.random() * 4 + 4) + 's');
                ff.style.setProperty('--ff-delay', (Math.random() * 5) + 's');
                ff.style.setProperty('--ff-x1', (Math.random() * 4 - 2) + 'vmin');
                ff.style.setProperty('--ff-y1', (Math.random() * 3 - 2) + 'vmin');
                ff.style.setProperty('--ff-x2', (Math.random() * 5 - 2.5) + 'vmin');
                ff.style.setProperty('--ff-y2', (Math.random() * 4 - 2.5) + 'vmin');
                ff.style.setProperty('--ff-x3', (Math.random() * 3 - 1.5) + 'vmin');
                ff.style.setProperty('--ff-y3', (Math.random() * 3 - 1.5) + 'vmin');
                firefliesContainer.appendChild(ff);
            }
        }

        function createSmoke() {
            chimneySmoke.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                const puff = document.createElement('div');
                puff.className = 'smoke-puff';
                const size = Math.random() * 1.5 + 1;
                puff.style.width = size + 'vmin';
                puff.style.height = size + 'vmin';
                puff.style.left = (Math.random() * 1 - 0.5) + 'vmin';
                puff.style.animationDelay = (i * 0.8) + 's';
                puff.style.animationDuration = (Math.random() * 2 + 3) + 's';
                chimneySmoke.appendChild(puff);
            }
        }

        function buildPoster() {
            posterGrid.innerHTML = '';
            animalMap.forEach(item => {
                const row = document.createElement('div');
                row.className = 'poster-row';
                row.innerHTML = `<span class="poster-animal"></span><span class="poster-equals">=</span><span class="poster-number"></span>`;
                row.setAttribute('data-digit', item.digit);
                posterGrid.appendChild(row);
            });
        }

        function generatePassword() {
            const shuffled = [...animalMap].sort(() => Math.random() - 0.5);
            passwordSequence = shuffled.slice(0, PASSWORD_LENGTH);
            currentStep = 0;
            isGameComplete = false;
        }

        function updateProgressDots() {
            const dots = progressDots.querySelectorAll('.progress-dot');
            dots.forEach((dot, index) => {
                dot.classList.remove('done', 'current');
                if (index < currentStep) dot.classList.add('done');
                else if (index === currentStep) dot.classList.add('current');
            });
        }

        function updateShadowDisplay() {
            if (currentStep < PASSWORD_LENGTH && !isGameComplete) {
                shadowEmoji.textContent = passwordSequence[currentStep].animal;
                shadowEmoji.classList.remove('reveal');
                shadowEmoji.style.filter = 'brightness(0)';
                screenHint.textContent = `第  位 · 這是什麼動物？`;
                digitPreview.textContent = '';
            }
        }

        function showToast(message, type = '') {
            if (toastTimer) clearTimeout(toastTimer);
            messageToast.textContent = message;
            messageToast.className = 'message-toast ' + type + ' show';
            toastTimer = setTimeout(() => messageToast.classList.remove('show', 'error', 'success'), 1800);
        }

        function playBeep(type) {
            try {
                const audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
                switch (type) {
                    case 'correct':
                        oscillator.type = 'sine';
                        oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
                        oscillator.frequency.setValueAtTime(1100, audioCtx.currentTime + 0.1);
                        break;
                    case 'wrong':
                        oscillator.type = 'sawtooth';
                        oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
                        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                        break;
                    case 'victory':
                        oscillator.type = 'sine';
                        oscillator.frequency.setValueAtTime(523, audioCtx.currentTime);
                        oscillator.frequency.setValueAtTime(659, audioCtx.currentTime + 0.15);
                        oscillator.frequency.setValueAtTime(784, audioCtx.currentTime + 0.3);
                        oscillator.frequency.setValueAtTime(1047, audioCtx.currentTime + 0.45);
                        gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
                        oscillator.stop(audioCtx.currentTime + 0.6);
                        return;
                    case 'click':
                        oscillator.type = 'sine';
                        oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
                        gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
                        break;
                }
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.3);
                setTimeout(() => { if (audioCtx.state !== 'closed') audioCtx.close(); }, 400);
            } catch (e) {}
        }

        function handleDigitInput(digit) {
            if (isGameComplete || currentStep >= PASSWORD_LENGTH) return;
            const expected = passwordSequence[currentStep].digit;
            if (digit === expected) {
                digitPreview.textContent = '✓ ' + digit;
                digitPreview.style.color = '#a8e6a3';
                shadowEmoji.classList.add('reveal');
                shadowEmoji.style.filter = 'brightness(1)';
                const dots = progressDots.querySelectorAll('.progress-dot');
                if (dots[currentStep]) {
                    dots[currentStep].classList.remove('current');
                    dots[currentStep].classList.add('done');
                }
                // 高亮對應的海報格子
                const rows = posterGrid.querySelectorAll('.poster-row');
                rows.forEach(r => {
                    if (parseInt(r.getAttribute('data-digit')) === digit) {
                        r.classList.add('highlight');
                        setTimeout(() => r.classList.remove('highlight'), 1500);
                    }
                });
                const btn = keypad.querySelector(`[data-digit=""]`);
                if (btn) { btn.classList.add('correct-flash'); setTimeout(() => btn.classList.remove('correct-flash'), 500); }
                playBeep('correct');
                currentStep++;
                if (currentStep >= PASSWORD_LENGTH) {
                    setTimeout(() => completeGame(), 700);
                } else {
                    setTimeout(() => {
                        updateProgressDots();
                        updateShadowDisplay();
                        digitPreview.textContent = '';
                        screenHint.textContent = `第  位 · 這是什麼動物？`;
                    }, 500);
                }
            } else {
                digitPreview.textContent = '✗ 重試';
                digitPreview.style.color = '#ff6666';
                const btn = keypad.querySelector(`[data-digit=""]`);
                if (btn) { btn.classList.add('wrong'); setTimeout(() => btn.classList.remove('wrong'), 500); }
                lockPanel.style.animation = 'none';
                void lockPanel.offsetWidth;
                lockPanel.style.animation = 'shake 0.5s ease';
                setTimeout(() => lockPanel.style.animation = '', 500);
                playBeep('wrong');
                showToast('❌ 數字不對，再看看影子吧～', 'error');
                shadowEmoji.style.filter = 'brightness(0.3)';
                setTimeout(() => { if (!isGameComplete) shadowEmoji.style.filter = 'brightness(0)'; }, 400);
            }
        }

        function handleClear() {
            if (isGameComplete) return;
            digitPreview.textContent = '';
            screenHint.textContent = `第  位 · 這是什麼動物？`;
        }

        function handleReset() {
            if (isGameComplete) return;
            generatePassword();
            currentStep = 0;
            digitPreview.textContent = '';
            updateProgressDots();
            updateShadowDisplay();
            screenHint.textContent = '第 1 位 · 這是什麼動物？';
            showToast('🔄 密碼已重置', '');
            playBeep('click');
        }

        function completeGame() {
            isGameComplete = true;
            screenHint.textContent = '🎉 密碼正確！';
            digitPreview.textContent = 'OK!';
            shadowEmoji.classList.add('reveal');
            shadowEmoji.style.filter = 'brightness(1)';
            document.querySelectorAll('.progress-dot').forEach(d => { d.classList.remove('current'); d.classList.add('done'); });
            playBeep('victory');
            setTimeout(() => { doorGlow.classList.add('visible'); door.classList.add('open'); }, 400);
            setTimeout(() => girl.classList.add('enter'), 900);
            setTimeout(() => victoryOverlay.classList.add('show'), 1600);
            showToast('🏠 歡迎回家！門已打開～', 'success');
        }

        function resetGame() {
            victoryOverlay.classList.remove('show');
            door.classList.remove('open');
            doorGlow.classList.remove('visible');
            girl.classList.remove('enter');
            shadowEmoji.classList.remove('reveal');
            shadowEmoji.style.filter = 'brightness(0)';
            isGameComplete = false;
            generatePassword();
            currentStep = 0;
            updateProgressDots();
            updateShadowDisplay();
            screenHint.textContent = '第 1 位 · 這是什麼動物？';
            posterGrid.querySelectorAll('.poster-row').forEach(r => r.classList.remove('highlight'));
        }

        keypad.addEventListener('click', e => {
            const btn = e.target.closest('.key-btn');
            if (!btn) return;
            const digitStr = btn.getAttribute('data-digit');
            if (digitStr === 'clear') { handleClear(); playBeep('click'); return; }
            if (digitStr === 'reset') { isGameComplete ? resetGame() : handleReset(); return; }
            const digit = parseInt(digitStr);
            if (!isNaN(digit)) handleDigitInput(digit);
        });

        document.addEventListener('keydown', e => {
            if (isGameComplete) { if (e.key === 'r' || e.key === 'R' || e.key === 'Enter') resetGame(); return; }
            if (e.key >= '0' && e.key <= '9') handleDigitInput(parseInt(e.key));
            else if (e.key === 'Backspace' || e.key === 'Delete') { handleClear(); playBeep('click'); }
            else if (e.key === 'Escape') handleReset();
        });

        replayBtn.addEventListener('click', resetGame);
        victoryOverlay.addEventListener('click', e => { if (e.target === victoryOverlay) resetGame(); });
        keypad.addEventListener('touchstart', e => { e.preventDefault(); e.target.closest('.key-btn')?.click(); }, { passive: false });

        function init() {
            createStars();
            createFireflies();
            createSmoke();
            buildPoster();
            generatePassword();
            updateProgressDots();
            updateShadowDisplay();
            screenHint.textContent = '第 1 位 · 這是什麼動物？';
        }
        init();
    })();
</script>
</body>
</html>
